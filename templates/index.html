<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahoo News Japan 검색기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px 30px;
        }

        .search-section {
            margin-bottom: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 2px solid #e9ecef;
        }

        .search-section h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-section h2::before {
            content: "🔍";
            font-size: 1.2em;
        }

        .date-filter {
            margin-bottom: 25px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            border: 2px solid #667eea;
        }

        .date-filter label {
            display: block;
            font-weight: 600;
            margin-bottom: 15px;
            color: #667eea;
            font-size: 1.1em;
        }

        .date-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .date-option {
            position: relative;
        }

        .date-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .date-option label {
            display: block;
            padding: 12px 20px;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            color: #495057;
        }

        .date-option input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }

        .date-option label:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #dee2e6;
        }

        .divider span {
            background: white;
            padding: 0 20px;
            position: relative;
            color: #6c757d;
            font-weight: 600;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 30px 20px;
            }

            .search-section {
                padding: 20px;
            }

            .date-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 Yahoo News Japan</h1>
            <p>일본 아이돌 뉴스를 검색하세요</p>
        </div>

        <div class="content">
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <!-- 날짜 필터 (공통) -->
            <div class="date-filter">
                <label>📅 검색 기간 선택</label>
                <div class="date-options">
                    <div class="date-option">
                        <input type="radio" name="days_ago_global" id="days_0" value="0" checked>
                        <label for="days_0">오늘</label>
                    </div>
                    <div class="date-option">
                        <input type="radio" name="days_ago_global" id="days_1" value="1">
                        <label for="days_1">어제</label>
                    </div>
                    <div class="date-option">
                        <input type="radio" name="days_ago_global" id="days_2" value="2">
                        <label for="days_2">2일 전</label>
                    </div>
                    <div class="date-option">
                        <input type="radio" name="days_ago_global" id="days_3" value="3">
                        <label for="days_3">3일 전</label>
                    </div>
                    <div class="date-option">
                        <input type="radio" name="days_ago_global" id="days_all" value="all">
                        <label for="days_all">전체 (7일)</label>
                    </div>
                </div>
            </div>

            <!-- 검색 옵션 1: 등록된 키워드로 검색 -->
            <div class="search-section">
                <h2>등록된 키워드로 검색</h2>
                <form action="/search" method="post">
                    <input type="hidden" name="search_type" value="select">
                    <input type="hidden" name="days_ago" id="days_select" value="0">
                    
                    <div class="form-group">
                        <label for="keyword_select">키워드 선택</label>
                        <select name="keyword_select" id="keyword_select" required>
                            <option value="">-- 키워드를 선택하세요 --</option>
                            {% for keyword in keywords %}
                            <option value="{{ keyword }}">{{ keyword }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <button type="submit">🔍 검색하기</button>
                </form>
            </div>

            <div class="divider"><span>OR</span></div>

            <!-- 검색 옵션 2: 새로운 키워드 입력 -->
            <div class="search-section">
                <h2>새로운 키워드로 검색</h2>
                <form action="/search" method="post">
                    <input type="hidden" name="search_type" value="new">
                    <input type="hidden" name="days_ago" id="days_new" value="0">
                    
                    <div class="form-group">
                        <label for="keyword_new">키워드 입력</label>
                        <input type="text" name="keyword_new" id="keyword_new" 
                               placeholder="예: 乃木坂, AKB48..." required>
                    </div>
                    
                    <button type="submit">🔍 검색하기</button>
                </form>
            </div>

            <div class="divider"><span>OR</span></div>

            <!-- 검색 옵션 3: 전체 키워드 검색 -->
            <div class="search-section">
                <h2>전체 키워드 검색</h2>
                <form action="/search" method="post">
                    <input type="hidden" name="search_type" value="all">
                    <input type="hidden" name="days_ago" id="days_all_search" value="0">
                    
                    <p style="color: #6c757d; margin-bottom: 20px;">
                        등록된 모든 키워드({{ keywords|length }}개)를 한 번에 검색합니다.
                    </p>
                    
                    <button type="submit">🔍 전체 검색하기</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 날짜 필터를 모든 폼에 동기화
        const dateRadios = document.querySelectorAll('input[name="days_ago_global"]');
        const hiddenDays = document.querySelectorAll('input[name="days_ago"]');
        
        dateRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                hiddenDays.forEach(hidden => {
                    hidden.value = this.value;
                });
            });
        });
    </script>
</body>
</html>
